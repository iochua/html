<!DOCTYPE html>
<html>
    <head>
        <title>jasjajs</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }
            .verde {
                width: 60px;
                height: 60px;
                background-color: green;
                float: left;
                margin: 10px;
                border-top-left-radius: 20px;
                border-bottom-left-radius: 20px;
                padding: 20px;
            }
            
            .blanco {
                width: 100px;
                height: 100px;
                background-color: white;
                float: left;
                margin: 10px;
                border: 20px palevioletred;
            }
            .rojo {
                width: 100px;
                height: 100px;
                background-color: red;
                float: left;
                margin: 10px;
                border-top-right-radius: 20px;
                border-bottom-right-radius: 20px;
            }
        </style>
    </head>
    <body>
        <div class="verde">HOLI</div>
        <div class="blanco"></div>
        <div class="rojo"></div>
    </body>
</html>
