<!DOCTYPE html>
<html>
    <head>
        <title>jasjajs</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }
            .verde {
                width: 60px;
                height: 60px;
                background-color: green;
                float: left;
                margin: 10px;
                border-top-left-radius: 20px;
                border-bottom-left-radius: 20px;
                padding: 20px;
                position: relative;  
                /* relativo: deja hueco en la direccion a la que se mueve, 
                absolute: se desplaza respecto a su contenedor más cercano, 
                fixed: se fija al scroll en la posicion en la que se encuentra */
                left: 200px; /*orientacion horizontal*/
                /* top: 200px; orientacion vertical*/
            }
            
            .blanco {
                width: 100px;
                height: 100px;
                background-color: white;
                float: left;
                margin: 10px;
                border: 20px palevioletred;
            }
            .rojo {
                width: 100px;
                height: 100px;
                background-color: red;
                float: left;
                margin: 10px;
                border-top-right-radius: 20px;
                border-bottom-right-radius: 20px;
            }

            img {
                width: 100px;
                height: 100px;
                position: relative;
                top: 200px;
                left: 200px;
            }
        </style>
    </head>
    <body>
        <div class="verde">HOLI</div>
        <div class="blanco"></div>
        <div class="rojo"></div>
        <img src="imagenes/escudo.jpg">
    </body>
</html>
