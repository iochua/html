<!DOCTYPE html>
<html>
    <head>
        <title>jasjajs</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }
            .hero-fondo-imagen{
                /*Color de fondo de respaldo por si tarda en cargar la imagen*/
                background-color: darkblue;
                /*Ruta de la imagen de fondo*/
                background-image: url('../fondo_imagen/imagenes/fondo.jpg');
                /*Evita que la imagen se repita en mosaico*/
                background-repeat: no-repeat;
                /*Centra la imagen perfectamente en el contenedor*/
                background-position: center center;
                /*Escala la imagen para cubrir todo el contenedor sin deformarse*/
                background-size: cover;
                /*Mantiene el fondo fijo al hacer scroll*/
                background-attachment: fixed;
            }          
        </style>
    </head>

</html>
